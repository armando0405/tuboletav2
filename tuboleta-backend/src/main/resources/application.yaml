server:
  # Render (y otros PaaS) inyectan el puerto por la variable PORT; en local
  # cae al 8088 de siempre.
  port: ${PORT:8088}
  # La app corre detrás del proxy HTTPS de Render: respeta X-Forwarded-* para
  # que las URLs y cookies se generen como https y no como http interno.
  forward-headers-strategy: framework

spring:
  application:
    name: tuboleta-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tuboleta_db}
    username: ${DB_USERNAME:tuboleta_user}
    password: ${DB_PASSWORD:tuboleta_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway es el único dueño del esquema (REQ-BD-003);
      # Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    # SQL de Hibernate apagado: ensucia los logs. Para depurar consultas,
    # ponlo en true temporalmente (o sube a DEBUG el logger org.hibernate.SQL).
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

notifications:
  # Mailgun es el proveedor de correo. La API key es SECRETA y llega por
  # variable de entorno (REQ-NOT-005); NUNCA versionada. En local usa el .env
  # (docker) o exporta MAIL_API_KEY; sin key, se usa el envío simulado (log).
  mailgun:
    api-key: ${MAIL_API_KEY:}
    sender-url: ${MAIL_SENDER_URL:https://api.mailgun.net/v3/arqbs.com/messages}
    from: ${MAIL_FROM:monitoreo@arqbs.com}
  email:
    from: ${EMAIL_FROM:notificaciones@tuboleta-v2.local}

scheduler:
  # Mecanismo del monitoreo automático (REQ-DET-005): "la BD es la cola".
  enabled: ${SCHEDULER_ENABLED:true}
  tick-ms: ${SCHEDULER_TICK_MS:60000}
  pool-size: ${SCHEDULER_POOL_SIZE:3}

keepalive:
  # Auto-ping contra el sleep de Render (plan free). Debe ser la URL PÚBLICA
  # del propio servicio (en Render: KEEPALIVE_URL=https://tuboletav2.onrender.com).
  # Vacío = desactivado (local/dev).
  url: ${KEEPALIVE_URL:}
  # Intervalo entre pings. 10 min < 15 min (umbral de sleep de Render).
  interval-ms: ${KEEPALIVE_INTERVAL_MS:600000}